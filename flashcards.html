<!DOCTYPE html>
<html>
<head>
  <title>Flashcards</title>
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>
  <h1>Notes to flashcards</h1>
  <textarea id="notes" rows="8" cols="50" placeholder="Paste your notes here"></textarea>
  <br>
  <button id="generateBtn">Generate flashcards</button>

  <div id="output"></div>

  <script>
      document.getElementById('generateBtn').addEventListener('click', async () => {
  const notes = document.getElementById('notes').value;
  document.getElementById('output').innerText = 'Generating...';

  try {
    const response = await puter.ai.chat(
      "Turn these notes into 5 flashcards. Respond with ONLY a JSON array like [{\"front\":\"...\",\"back\":\"...\"}], nothing else. Notes: " + notes
    );

    const flashcards = JSON.parse(response.message.content);

    document.getElementById('output').innerText = JSON.stringify(flashcards, null, 2);
  } catch (err) {
    document.getElementById('output').innerText = 'Error: ' + err;
  }
});
  </script>
</body>
</html>
