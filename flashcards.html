<!DOCTYPE html>
<html>
<head>
  <title>Flashcards</title>
</head>
<body>
  <h1>Notes to flashcards</h1>

  <input type="password" id="apiKey" placeholder="Paste your API key" style="width: 400px;">
  <br><br>
  <textarea id="notes" rows="8" cols="50" placeholder="Paste your notes here"></textarea>
  <br>
  <button id="generateBtn">Generate flashcards</button>

  <div id="output"></div>

  <script>
        document.getElementById('generateBtn').addEventListener('click', async () => {
      const apiKey = document.getElementById('apiKey').value;
      const notes = document.getElementById('notes').value;

      document.getElementById('output').innerText = 'Generating...';

      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: "Turn these notes into 5 flashcards. Respond with ONLY a JSON array like [{\"front\":\"...\",\"back\":\"...\"}], nothing else. Notes: " + notes
          }]
        })
      });

      const data = await response.json();
      document.getElementById('output').innerText = data.content[0].text;
    });
  </script>
</body>
</html>
